<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Lato...&display=swap"
      as="style"
    />
    <title>Our online courses</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="title-block">
          <h1 class="title">Our online courses</h1>
          <h2 class="subtitle">Enjoy your studying!</h2>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <section class="filter-search-container">
          <h3 class="visually-hidden">Choose a category or find a course</h3>
          <ul class="filter"></ul>
          <form action="" class="search-form">
            <input
              type="text"
              class="search-form__input"
              placeholder="Search course..."
              name="search"
            />
            <button type="submit" class="search-form__button">
              <img
                src="images/search.svg"
                alt="Search"
                class="search-form__image"
              />
            </button>
          </form>
        </section>

        <ul class="courses-list"></ul>
        <div>
          <button type="button" class="load-more">
            <img
              src="/images/convert.svg"
              alt="Load more"
              class="load-more__image"
            />Load more
          </button>
        </div>
        <!-- end container -->
      </div>
    </main>

    <script src="index.js" type="module"></script>
  </body>
</html>
